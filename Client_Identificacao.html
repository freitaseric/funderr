<script>

  let identificacaoAtual =
    null;

  let identificacaoProcessoId =
    null;


  const CATEGORIAS_EMPREGOS = [
    'ADMINISTRATIVA',
    'TECNICA',
    'PRODUTIVA',
    'OUTROS'
  ];


  function registrarEventosIdentificacao() {

    document
      .querySelectorAll(
        '[data-emprego-input]'
      )
      .forEach(
        input => {

          input.addEventListener(
            'input',
            atualizarTotaisEmpregos
          );

        }
      );


    document
      .getElementById(
        'identificacaoFaturamento'
      )
      .addEventListener(
        'blur',
        formatarCampoMonetarioIdentificacao_
      );


    document
      .getElementById(
        'formIdentificacaoProposta'
      )
      .addEventListener(
        'input',
        event => {

          if (
            event.target.matches(
              '[data-uso-input], [data-fonte-input]'
            )
          ) {
            atualizarTotaisUsosFontesUI();
          }

        }
      );


    document
      .getElementById(
        'formIdentificacaoProposta'
      )
      .addEventListener(
        'focusout',
        event => {

          if (
            event.target.matches(
              '[data-uso-input], [data-fonte-input]'
            )
          ) {
            const numero =
              converterNumeroCliente(
                event.target.value
              );


            event.target.value =
              formatarNumeroEditavel(
                numero
              );


            atualizarTotaisUsosFontesUI();
          }

        }
      );

  }


  function formatarCampoMonetarioIdentificacao_(
    event
  ) {
    const valor =
      converterNumeroCliente(
        event.target.value
      );


    event.target.value =
      formatarNumeroEditavel(
        valor
      );
  }


  function abrirIdentificacao(
    propostaId
  ) {

    if (
      !abrirPagina(
        'identificacao'
      )
    ) {
      return;
    }


    identificacaoProcessoId =
      propostaId;


    processoAtualId =
      propostaId;


    carregarIdentificacao(
      propostaId
    );
  }


  function voltarAoProcessoIdentificacao() {

    const id =
      identificacaoProcessoId;


    if (
      !abrirPagina(
        'processos'
      )
    ) {
      return;
    }


    if (id) {
      abrirProcesso(
        id
      );
    }
  }


  function carregarIdentificacao(
    propostaId
  ) {

    document
      .getElementById(
        'identificacaoProcessoNumero'
      )
      .textContent =
        'Carregando...';


    google.script.run

      .withSuccessHandler(
        renderizarIdentificacaoCompleta
      )

      .withFailureHandler(
        erro => {

          const mensagem =
            document.getElementById(
              'mensagemIdentificacao'
            );


          mensagem.className =
            'message erro';


          mensagem.textContent =
            erro.message ||
            String(erro);
        }
      )

      .obterIdentificacaoProposta(
        propostaId
      );
  }


  function renderizarIdentificacaoCompleta(
    dados
  ) {

    identificacaoAtual =
      dados;


    identificacaoProcessoId =
      dados.processo.id;


    document
      .getElementById(
        'identificacaoProcessoNumero'
      )
      .textContent =
        `Processo ${dados.processo.numero}`;


    document
      .getElementById(
        'identificacaoProcessoBeneficiario'
      )
      .textContent =
        dados.processo.beneficiarioNome;


    document
      .getElementById(
        'identificacaoContexto'
      )
      .innerHTML = `

        ${detalhe(
          'CPF',
          formatarCpf(
            dados.processo.beneficiarioCpf
          )
        )}

        ${detalhe(
          'Propriedade',
          dados.processo.propriedadeNome
        )}

        ${detalhe(
          'Município',
          dados.processo.propriedadeMunicipio
        )}

        ${detalhe(
          'Atividade',
          dados.processo.atividade
        )}

      `;


    preencherCaracterizacaoIdentificacao(
      dados
    );


    preencherEmpregosIdentificacao(
      dados
    );


    renderizarUsosIdentificacao(
      dados
    );


    renderizarFontesIdentificacao(
      dados
    );


    renderizarStatusIdentificacao(
      dados
    );


    atualizarTotaisUsosFontesUI();


    marcarFormularioSalvo();
  }


  function preencherCaracterizacaoIdentificacao(
    dados
  ) {

    const identificacao =
      dados.identificacao;


    document
      .getElementById(
        'identificacaoFinalidade'
      )
      .value =
        identificacao.finalidade;


    document
      .getElementById(
        'identificacaoMercado'
      )
      .value =
        identificacao.mercado;


    document
      .getElementById(
        'identificacaoFaturamento'
      )
      .value =
        identificacao
          .faturamentoUltimoAno === ''
            ? ''
            : formatarNumeroEditavel(
                identificacao
                  .faturamentoUltimoAno
              );


    document
      .getElementById(
        'identificacaoAnaliseLocalizacao'
      )
      .value =
        identificacao
          .analiseLocalizacao;


    document
      .getElementById(
        'identificacaoConsideracoes'
      )
      .value =
        identificacao.consideracoes;


    document
      .getElementById(
        'identificacaoEmpregosConfirmados'
      )
      .checked =
        identificacao
          .empregosConfirmados;


    document
      .getElementById(
        'identificacaoUsosFontesConfirmados'
      )
      .checked =
        identificacao
          .usosFontesConfirmados;
  }


  function preencherEmpregosIdentificacao(
    dados
  ) {

    dados.empregos.forEach(
      item => {

        document
          .getElementById(
            `emprego_${item.categoria}_atual`
          )
          .value =
            item.faseAtual;


        document
          .getElementById(
            `emprego_${item.categoria}_expansao`
          )
          .value =
            item.faseExpansao;
      }
    );


    atualizarTotaisEmpregos();
  }


  function atualizarTotaisEmpregos() {

    CATEGORIAS_EMPREGOS.forEach(
      categoria => {

        const atual =
          Number(
            document
              .getElementById(
                `emprego_${categoria}_atual`
              )
              .value ||
            0
          );


        const expansao =
          Number(
            document
              .getElementById(
                `emprego_${categoria}_expansao`
              )
              .value ||
            0
          );


        document
          .getElementById(
            `emprego_${categoria}_total`
          )
          .value =
            atual +
            expansao;
      }
    );
  }


  function renderizarUsosIdentificacao(
    dados
  ) {

    const container =
      document.getElementById(
        'identificacaoTabelaUsos'
      );


    container.innerHTML =
      dados.usos
        .map(
          item => `

            <tr>

              <td>
                <strong>
                  ${escaparHtml(item.nome)}
                </strong>
              </td>

              <td>
                <input
                  id="uso_${escaparAtributo(item.categoria)}_realizado"
                  class="campo-derivado"
                  readonly
                  value="${escaparHtml(formatarNumeroEditavel(item.realizado))}"
                >
              </td>

              <td>
                <input
                  id="uso_${escaparAtributo(item.categoria)}_aRealizar"
                  data-uso-input
                  inputmode="decimal"
                  value="${escaparHtml(formatarNumeroEditavel(item.aRealizar))}"
                >
              </td>

              <td>
                <input
                  id="uso_${escaparAtributo(item.categoria)}_total"
                  class="campo-derivado"
                  readonly
                  value="${escaparHtml(formatarNumeroEditavel(item.total))}"
                >
              </td>

            </tr>

          `
        )
        .join('');
  }


  function renderizarFontesIdentificacao(
    dados
  ) {

    const container =
      document.getElementById(
        'identificacaoTabelaFontes'
      );


    container.innerHTML =
      dados.fontes
        .map(
          item => `

            <tr>

              <td>
                <strong>
                  ${escaparHtml(item.nome)}
                </strong>

                ${
                  item.derivado
                    ? `
                      <div class="field-help">
                        Calculado pelo levantamento patrimonial
                      </div>
                    `
                    : ''
                }
              </td>

              <td>

                <input
                  id="fonte_${escaparAtributo(item.categoria)}"
                  ${
                    item.derivado
                      ? 'readonly class="campo-derivado"'
                      : 'data-fonte-input'
                  }
                  inputmode="decimal"
                  value="${escaparHtml(formatarNumeroEditavel(item.valor))}"
                >

              </td>

            </tr>

          `
        )
        .join('');
  }


  function atualizarTotaisUsosFontesUI() {

    if (!identificacaoAtual) {
      return;
    }


    let totalUsos =
      0;


    identificacaoAtual
      .usos
      .forEach(
        item => {

          const realizado =
            converterNumeroCliente(
              document
                .getElementById(
                  `uso_${item.categoria}_realizado`
                )
                ?.value
            );


          const aRealizar =
            converterNumeroCliente(
              document
                .getElementById(
                  `uso_${item.categoria}_aRealizar`
                )
                ?.value
            );


          const total =
            realizado +
            aRealizar;


          totalUsos +=
            total;


          const totalInput =
            document.getElementById(
              `uso_${item.categoria}_total`
            );


          if (totalInput) {
            totalInput.value =
              formatarNumeroEditavel(
                total
              );
          }
        }
      );


    let totalFontes =
      0;


    identificacaoAtual
      .fontes
      .forEach(
        item => {

          totalFontes +=
            converterNumeroCliente(
              document
                .getElementById(
                  `fonte_${item.categoria}`
                )
                ?.value
            );
        }
      );


    const diferenca =
      totalFontes -
      totalUsos;


    document
      .getElementById(
        'identificacaoResumoUsosFontes'
      )
      .innerHTML = `

        <div>
          <span>Total dos usos</span>
          <strong>${formatarMoedaBR(totalUsos)}</strong>
        </div>

        <div>
          <span>Total das fontes</span>
          <strong>${formatarMoedaBR(totalFontes)}</strong>
        </div>

        <div>
          <span>Diferença</span>
          <strong>${formatarMoedaBR(diferenca)}</strong>
        </div>

      `;


    const aviso =
      document.getElementById(
        'identificacaoAvisoBalanceamento'
      );


    if (
      Math.abs(
        diferenca
      ) < 0.01
    ) {
      aviso.className =
        'balanceamento-card equilibrado';


      aviso.textContent =
        'Usos e fontes estão equilibrados.';

    } else {
      aviso.className =
        'balanceamento-card divergente';


      aviso.textContent =
        'Usos e fontes possuem diferença de ' +
        formatarMoedaBR(
          diferenca
        ) +
        '. Nesta versão isso é um alerta, não um bloqueio.';
    }
  }


  function renderizarStatusIdentificacao(
    dados
  ) {

    const statusMap = {
      PENDENTE:
        'PENDENTE',

      RASCUNHO:
        'RASCUNHO',

      EM_REVISAO:
        'EM REVISÃO',

      CONCLUIDO:
        'CONCLUÍDO'
    };


    const status =
      dados.identificacao.status;


    const statusElement =
      document.getElementById(
        'identificacaoStatus'
      );


    statusElement.textContent =
      statusMap[
        status
      ] || status;


    statusElement.className =
      'status';


    if (
      status ===
      'CONCLUIDO'
    ) {
      statusElement.classList.add(
        'status-concluido'
      );
    }


    if (
      status ===
      'EM_REVISAO'
    ) {
      statusElement.classList.add(
        'status-revisao'
      );
    }


    document
      .getElementById(
        'identificacaoCompletude'
      )
      .innerHTML = `

        <div class="progresso-info">

          <span>
            Preparação para conclusão
          </span>

          <span>
            ${dados.completude.percentual}%
          </span>

        </div>

        <div class="progresso-barra">

          <div
            class="progresso-preenchimento"
            style="width:${dados.completude.percentual}%"
          ></div>

        </div>

      `;


    const pendencias =
      document.getElementById(
        'identificacaoPendencias'
      );


    pendencias.hidden =
      false;


    if (
      dados.completude
        .camposFaltantes
        .length
    ) {
      pendencias.className =
        'pendencias-card';


      pendencias.innerHTML = `

        <strong>
          Pendências para concluir:
        </strong>

        <div>
          ${escaparHtml(
            dados.completude
              .camposFaltantes
              .join('; ')
          )}.
        </div>

      `;

    } else {
      pendencias.className =
        'pendencias-card completa';


      pendencias.textContent =
        status === 'CONCLUIDO'
          ? 'Identificação concluída.'
          : 'A etapa está pronta para ser concluída.';
    }


    const botao =
      document.getElementById(
        'btnConcluirIdentificacao'
      );


    botao.disabled =
      status ===
      'CONCLUIDO';


    botao.textContent =
      status ===
      'CONCLUIDO'
        ? 'Identificação concluída'
        : (
            status ===
            'EM_REVISAO'
              ? 'Concluir novamente'
              : 'Concluir identificação'
          );
  }


  function coletarDadosIdentificacao() {

    const empregos =
      CATEGORIAS_EMPREGOS
        .map(
          categoria => ({
            categoria,

            faseAtual:
              document
                .getElementById(
                  `emprego_${categoria}_atual`
                )
                .value,

            faseExpansao:
              document
                .getElementById(
                  `emprego_${categoria}_expansao`
                )
                .value
          })
        );


    const usos =
      identificacaoAtual.usos
        .map(
          item => ({
            categoria:
              item.categoria,

            aRealizar:
              document
                .getElementById(
                  `uso_${item.categoria}_aRealizar`
                )
                .value
          })
        );


    const fontes =
      identificacaoAtual.fontes
        .filter(
          item =>
            !item.derivado
        )
        .map(
          item => ({
            categoria:
              item.categoria,

            valor:
              document
                .getElementById(
                  `fonte_${item.categoria}`
                )
                .value
          })
        );


    return {
      propostaId:
        identificacaoProcessoId,

      finalidade:
        document
          .getElementById(
            'identificacaoFinalidade'
          )
          .value,

      mercado:
        document
          .getElementById(
            'identificacaoMercado'
          )
          .value,

      faturamentoUltimoAno:
        document
          .getElementById(
            'identificacaoFaturamento'
          )
          .value,

      analiseLocalizacao:
        document
          .getElementById(
            'identificacaoAnaliseLocalizacao'
          )
          .value,

      consideracoes:
        document
          .getElementById(
            'identificacaoConsideracoes'
          )
          .value,

      empregosConfirmados:
        document
          .getElementById(
            'identificacaoEmpregosConfirmados'
          )
          .checked,

      usosFontesConfirmados:
        document
          .getElementById(
            'identificacaoUsosFontesConfirmados'
          )
          .checked,

      empregos,

      usos,

      fontes
    };
  }


  function salvarIdentificacaoUI(
    callback
  ) {

    const mensagem =
      document.getElementById(
        'mensagemIdentificacao'
      );


    const botao =
      document.getElementById(
        'btnSalvarIdentificacao'
      );


    botao.disabled =
      true;


    mensagem.className =
      'message loading';


    mensagem.textContent =
      'Salvando identificação...';


    google.script.run

      .withSuccessHandler(
        dados => {

          botao.disabled =
            false;


          marcarFormularioSalvo();


          renderizarIdentificacaoCompleta(
            dados
          );


          mensagem.className =
            'message sucesso';


          mensagem.textContent =
            'Rascunho salvo com sucesso.';


          if (
            typeof callback ===
            'function'
          ) {
            callback(
              dados
            );
          }
        }
      )

      .withFailureHandler(
        erro => {

          botao.disabled =
            false;


          mensagem.className =
            'message erro';


          mensagem.textContent =
            erro.message ||
            String(erro);
        }
      )

      .salvarIdentificacaoProposta(
        coletarDadosIdentificacao()
      );
  }


  function concluirIdentificacaoUI() {

    const mensagem =
      document.getElementById(
        'mensagemIdentificacao'
      );


    mensagem.className =
      'message loading';


    mensagem.textContent =
      'Salvando e validando a etapa...';


    salvarIdentificacaoUI(
      () => {

        google.script.run

          .withSuccessHandler(
            dados => {

              marcarFormularioSalvo();


              renderizarIdentificacaoCompleta(
                dados
              );


              mensagem.className =
                'message sucesso';


              mensagem.textContent =
                'Identificação da proposta concluída com sucesso.';
            }
          )

          .withFailureHandler(
            erro => {

              mensagem.className =
                'message erro';


              mensagem.textContent =
                erro.message ||
                String(erro);
            }
          )

          .concluirIdentificacaoProposta(
            identificacaoProcessoId
          );
      }
    );
  }

</script>
