# FUNDERR PostgreSQL Data Connect Schema (Cloud SQL / Firebase Data Connect)
# Region: southamerica-east1

type User @table {
  id: String! @default(expr: "uuidV4()")
  email: String! @unique
  name: String!
  role: String # ADMIN, GESTOR, TECNICO, CONSULTA, PENDING
  status: String! # PENDING, ACTIVE, DISABLED
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Beneficiary @table {
  id: String! @default(expr: "uuidV4()")
  nome: String!
  cpf: String! @unique
  telefone: String!
  apelido: String
  nacionalidade: String @default(value: "Brasileira")
  naturalidade: String
  estadoCivil: String # SOLTEIRO, CASADO, UNIAO_ESTAVEL, etc.
  dataNascimento: Date
  profissao: String
  rg: String
  escolaridade: String
  endereco: String
  dependentes: Int @default(value: 0)
  conjugeNome: String
  conjugeRg: String
  conjugeCpf: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type BeneficiaryReference @table {
  id: String! @default(expr: "uuidV4()")
  beneficiaryId: String!
  ordem: Int!
  nome: String!
  telefone: String!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Property @table {
  id: String! @default(expr: "uuidV4()")
  beneficiaryId: String!
  denominacao: String!
  endereco: String!
  municipio: String! # One of 15 Roraima municipalities
  estado: String! @default(value: "RR")
  areaTotal: Float!
  areaDisponivel: Float
  areaLegal: Float
  formaOcupacao: String!
  tempoExploracao: String
  modulo: String
  documentoExistente: String!
  latitude: Float
  longitude: Float
  placeId: String
  confrontacaoNorte: String
  confrontacaoSul: String
  confrontacaoLeste: String
  confrontacaoOeste: String
  administracao: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Proposal @table {
  id: String! @default(expr: "uuidV4()")
  numero: String! @unique # Formato AAAA-NNNN
  beneficiaryId: String!
  propertyId: String!
  data: Date!
  atividade: String!
  status: String! @default(value: "EM ELABORAÇÃO")
  createdById: String
  patrimonioRevisadoEm: Timestamp
  identificacaoRevisadaEm: Timestamp
  fluxoRevisadoEm: Timestamp
  financiamentoRevisadoEm: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type ProposalStatusHistory @table {
  id: String! @default(expr: "uuidV4()")
  proposalId: String!
  etapa: String!
  statusAnterior: String
  statusNovo: String!
  motivo: String
  userId: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

type PatrimonyItem @table {
  id: String! @default(expr: "uuidV4()")
  proposalId: String!
  categoria: String!
  especificacao: String!
  unidade: String!
  quantidade: Float!
  valorUnitario: Float!
  valorTotal: Float!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type PatrimonyDebt @table {
  id: String! @default(expr: "uuidV4()")
  proposalId: String!
  credor: String!
  finalidade: String!
  vencimento: String!
  saldoDevedor: Float!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type ProposalJob @table {
  id: String! @default(expr: "uuidV4()")
  proposalId: String!
  categoria: String!
  faseAtual: Int!
  faseExpansao: Int!
  total: Int!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type ProposalUseSource @table {
  id: String! @default(expr: "uuidV4()")
  proposalId: String!
  tipo: String! # USO ou FONTE
  categoria: String!
  valor: Float!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type ProposalIdentification @table {
  id: String! @default(expr: "uuidV4()")
  proposalId: String! @unique
  finalidade: String!
  mercado: String!
  faturamentoUltimoAno: Float!
  analiseLocalizacao: String!
  consideracoes: String!
  empregosConfirmados: Boolean! @default(value: false)
  usosFontesConfirmados: Boolean! @default(value: false)
  status: String! @default(value: "PENDENTE")
  concluidoEm: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type CashFlowItem @table {
  id: String! @default(expr: "uuidV4()")
  proposalId: String!
  tipo: String! # RECEITA, CUSTO_VARIAVEL, CUSTO_FIXO
  descricao: String!
  unidade: String!
  quantidade: Float!
  valorUnitario: Float!
  ano1: Float! @default(value: 0)
  ano2: Float! @default(value: 0)
  ano3: Float! @default(value: 0)
  ano4: Float! @default(value: 0)
  ano5: Float! @default(value: 0)
  ano6: Float! @default(value: 0)
  ano7: Float! @default(value: 0)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type CreditLine @table {
  id: String! @default(expr: "uuidV4()")
  codigo: String! @unique
  nome: String!
  ativo: Boolean! @default(value: true)
  tetoFinanciamento: Float!
  taxaJurosAnual: Float!
  prazoMaxAnos: Int!
  carenciaMaxAnos: Int!
  percentualFinanciavelMax: Float!
  percentualAterPadrao: Float!
  observacoes: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type FinancingScenario @table {
  id: String! @default(expr: "uuidV4()")
  proposalId: String! @unique
  linhaCreditoId: String!
  linhaCreditoNome: String!
  valorProposta: Float!
  percentualFinanciavel: Float!
  valorFinanciado: Float!
  percentualAter: Float!
  valorAter: Float!
  valorProjeto: Float!
  taxaJurosAnual: Float!
  prazoTotalAnos: Int!
  carenciaAnos: Int!
  numeroParcelas: Int!
  periodicidade: String! @default(value: "ANUAL")
  jurosCarencia: String! @default(value: "PAGAR") # PAGAR, CAPITALIZAR
  garantiasConfirmadas: Boolean! @default(value: false)
  cronogramaConfirmado: Boolean! @default(value: false)
  status: String! @default(value: "PENDENTE")
  concluidoEm: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Guarantee @table {
  id: String! @default(expr: "uuidV4()")
  proposalId: String!
  tipo: String! # AVAL_PESSOAL, BEM, OUTRA
  descricao: String!
  garantidorNome: String
  garantidorCpf: String
  garantidorTelefone: String
  valorEstimado: Float
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type ProposalDocument @table {
  id: String! @default(expr: "uuidV4()")
  proposalId: String!
  tipo: String!
  nomeArquivo: String!
  mimeType: String!
  tamanhoBytes: Int!
  storagePath: String!
  status: String! @default(value: "PROCESSING") # PROCESSING, REVIEW_REQUIRED, CONFIRMED, FAILED
  extractedDataJson: String
  aiConfidence: Float
  humanConfirmedBy: String
  humanConfirmedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type AuditLog @table {
  id: String! @default(expr: "uuidV4()")
  userId: String!
  userName: String
  userRole: String
  acao: String!
  entidade: String!
  entityId: String!
  correlationId: String!
  metadataJson: String
  beforeJson: String
  afterJson: String
  createdAt: Timestamp! @default(expr: "request.time")
}
