<section
  id="pagina-processos"
  class="pagina ativa"
>

  <div class="page-header">

    <h2>
      Processos FUNDERR
    </h2>

    <p>
      Cadastro, acompanhamento e execução
      dos processos de financiamento.
    </p>

  </div>


  <div class="card">

    <h3>
      Novo processo
    </h3>


    <form id="formProcesso">

      <div class="form-grid">

        <div class="span-2">

          <label for="beneficiarioProcesso">
            Beneficiário
          </label>

          <select
            id="beneficiarioProcesso"
            required
          >

            <option value="">
              Selecione...
            </option>

          </select>

        </div>


        <div class="span-2">

          <label for="propriedadeProcesso">
            Propriedade
          </label>

          <select
            id="propriedadeProcesso"
            required
            disabled
          >

            <option value="">
              Selecione primeiro o beneficiário...
            </option>

          </select>


          <div
            id="acaoSemPropriedade"
            class="context-action"
            hidden
          >

            <button
              type="button"
              class="secondary"
              onclick="cadastrarPropriedadeParaBeneficiarioAtual()"
            >
              + Cadastrar propriedade para este beneficiário
            </button>

          </div>

        </div>


        <div>

          <label for="dataProcesso">
            Data
          </label>

          <input
            id="dataProcesso"
            type="date"
            required
          >

        </div>


        <div class="span-2">

          <label for="atividadeProcesso">
            Atividade
          </label>

          <input
            id="atividadeProcesso"
            placeholder="Ex.: Bovinocultura"
            required
          >

        </div>

      </div>


      <div class="actions">

        <button
          id="btnSalvarProcesso"
          class="primary"
          type="submit"
        >
          Criar processo
        </button>

      </div>


      <div
        id="mensagemProcesso"
        class="message"
      ></div>

    </form>

  </div>


  <div id="painelProcesso">

    <div class="card">

      <div class="processo-topo">

        <div>

          <h2
            id="processoNumero"
            class="processo-numero"
          ></h2>

          <p
            id="processoSubtitulo"
            class="processo-subtitulo"
          ></p>

        </div>


        <span
          id="processoStatus"
          class="status"
        ></span>

      </div>


      <div
        id="processoInformacoes"
        class="processo-info"
      ></div>


      <div
        id="processoAtalhos"
        class="processo-atalhos"
      ></div>

    </div>


    <div class="card">

      <h3>
        Etapas do processo
      </h3>


      <div
        id="processoProgresso"
        class="progresso"
      ></div>


      <div
        id="processoEtapas"
        class="processo-etapas"
      ></div>

    </div>

  </div>


  <div class="card">

    <h3>
      Processos cadastrados
    </h3>


    <div class="search-box">

      <label for="buscaProcessos">
        Pesquisar
      </label>

      <input
        id="buscaProcessos"
        type="search"
        placeholder="Número, nome, CPF, propriedade ou atividade..."
      >

    </div>


    <div id="listaProcessos">
      Carregando...
    </div>

  </div>

</section>
