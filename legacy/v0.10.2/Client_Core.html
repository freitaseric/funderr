<script>

  let propriedadesDisponiveis =
    [];

  let formularioAlterado =
    false;

  let processoAtualId =
    null;


  window.addEventListener(
    'DOMContentLoaded',
    inicializarAplicacao
  );


  async function inicializarAplicacao() {

    /*
     * =======================================================
     * GOVBR-DS PRIMEIRO
     * =======================================================
     *
     * Os controles nativos precisam virar proxies
     * ANTES de registrarmos os listeners existentes.
     */

    if (
      typeof prepararGovBrDS ===
      'function'
    ) {

      try {

        await prepararGovBrDS();

      } catch (
        erro
      ) {

        /*
         * Falha de CDN nunca deve impedir
         * o FUNDERR de funcionar.
         */
        console.warn(
          'GovBR-DS indisponível. FUNDERR seguirá com os controles nativos.',
          erro
        );

      }

    }


    /*
     * =======================================================
     * CLIENTS FUNDERR
     * =======================================================
     */

    registrarEventosBeneficiarios();

    registrarEventosPropriedades();

    registrarEventosProcessos();

    registrarEventosPatrimonio();

    registrarEventosIdentificacao();

    registrarEventosFluxoCaixa();

    registrarEventosFinanciamento();

    registrarProtecaoAlteracoes();

    definirDataHoje();

    carregarBeneficiarios();

    carregarPropriedades();

    carregarProcessos();

  }


  function registrarProtecaoAlteracoes() {

    [
      'formBeneficiario',
      'formPropriedade',
      'formProcesso',
      'formPatrimonioItem',
      'formPatrimonioDivida',
      'formIdentificacaoProposta',
      'formFluxoCaixaItem',
      'formFinanciamentoCondicoes',
      'formGarantiaFinanciamento'
    ].forEach(
      id => {

        const form =
          document.getElementById(
            id
          );


        if (!form) {
          return;
        }


        form.addEventListener(
          'input',
          marcarFormularioAlterado
        );


        form.addEventListener(
          'change',
          marcarFormularioAlterado
        );

      }
    );


    window.addEventListener(
      'beforeunload',
      event => {

        if (
          !formularioAlterado
        ) {
          return;
        }


        event.preventDefault();

        event.returnValue =
          '';

      }
    );

  }


  function marcarFormularioAlterado() {

    formularioAlterado =
      true;

  }


  function marcarFormularioSalvo() {

    formularioAlterado =
      false;

  }


  function confirmarDescartarAlteracoes() {

    if (
      !formularioAlterado
    ) {
      return true;
    }


    const confirmar =
      window.confirm(
        'Existem alterações não salvas. Deseja descartá-las?'
      );


    if (
      confirmar
    ) {
      formularioAlterado =
        false;
    }


    return confirmar;

  }


  function abrirPagina(
    nome
  ) {

    const atual =
      document
        .querySelector(
          '.pagina.ativa'
        )
        ?.id;


    if (
      atual !==
      `pagina-${nome}` &&
      !confirmarDescartarAlteracoes()
    ) {
      return false;
    }


    document
      .querySelectorAll(
        '.pagina'
      )
      .forEach(
        pagina => {

          pagina.classList.remove(
            'ativa'
          );

        }
      );


    document
      .querySelectorAll(
        '.nav-button'
      )
      .forEach(
        botao => {

          botao.classList.remove(
            'ativo'
          );

        }
      );


    const pagina =
      document.getElementById(
        `pagina-${nome}`
      );


    if (!pagina) {

      console.error(
        `Página não encontrada: ${nome}`
      );


      return false;

    }


    pagina.classList.add(
      'ativa'
    );


    const paginaMenu =
      [
        'patrimonio',
        'identificacao',
        'fluxo-caixa',
        'financiamento'
      ].includes(
        nome
      )
        ? 'processos'
        : nome;


    document
      .querySelector(
        `[data-page="${paginaMenu}"]`
      )
      ?.classList
      .add(
        'ativo'
      );


    if (
      nome ===
      'processos'
    ) {

      carregarBeneficiarios();

      carregarPropriedades();

      carregarProcessos();

    }


    if (
      nome ===
      'propriedades'
    ) {

      carregarBeneficiarios();

      carregarPropriedades();

    }


    return true;

  }


  function definirDataHoje() {

    const input =
      document.getElementById(
        'dataProcesso'
      );


    if (!input) {
      return;
    }


    const hoje =
      new Date();


    const ano =
      hoje.getFullYear();


    const mes =
      String(
        hoje.getMonth() + 1
      ).padStart(
        2,
        '0'
      );


    const dia =
      String(
        hoje.getDate()
      ).padStart(
        2,
        '0'
      );


    input.value =
      `${ano}-${mes}-${dia}`;

  }


  function detalhe(
    label,
    valor
  ) {

    return `

      <div>

        <div class="detalhe-label">
          ${escaparHtml(label)}
        </div>

        <div class="detalhe-valor">
          ${escaparHtml(valor)}
        </div>

      </div>

    `;

  }


  function formatarCpf(
    valor
  ) {

    const cpf =
      String(
        valor || ''
      )
        .replace(
          /\D/g,
          ''
        )
        .slice(
          0,
          11
        );


    if (
      cpf.length <= 3
    ) {
      return cpf;
    }


    if (
      cpf.length <= 6
    ) {

      return (
        cpf.slice(
          0,
          3
        ) +
        '.' +
        cpf.slice(
          3
        )
      );

    }


    if (
      cpf.length <= 9
    ) {

      return (
        cpf.slice(
          0,
          3
        ) +
        '.' +
        cpf.slice(
          3,
          6
        ) +
        '.' +
        cpf.slice(
          6
        )
      );

    }


    return (
      cpf.slice(
        0,
        3
      ) +
      '.' +
      cpf.slice(
        3,
        6
      ) +
      '.' +
      cpf.slice(
        6,
        9
      ) +
      '-' +
      cpf.slice(
        9
      )
    );

  }


  function formatarTelefone(
    valor
  ) {

    const telefone =
      String(
        valor || ''
      )
        .replace(
          /\D/g,
          ''
        )
        .slice(
          0,
          11
        );


    if (
      telefone.length <= 2
    ) {
      return telefone;
    }


    const ddd =
      telefone.slice(
        0,
        2
      );


    const restante =
      telefone.slice(
        2
      );


    if (
      telefone.length <= 10
    ) {

      if (
        restante.length <= 4
      ) {

        return (
          `(${ddd}) ${restante}`
        );

      }


      return (
        `(${ddd}) ` +
        restante.slice(
          0,
          4
        ) +
        '-' +
        restante.slice(
          4
        )
      );

    }


    return (
      `(${ddd}) ` +
      restante.slice(
        0,
        5
      ) +
      '-' +
      restante.slice(
        5
      )
    );

  }


  function formatarMoedaBR(
    valor
  ) {

    return new Intl.NumberFormat(
      'pt-BR',
      {
        style:
          'currency',

        currency:
          'BRL'
      }
    ).format(
      Number(
        valor || 0
      )
    );

  }


  function converterNumeroCliente(
    valor
  ) {

    const texto =
      String(
        valor || ''
      )
        .trim()
        .replace(
          /R\$/g,
          ''
        )
        .replace(
          /\s/g,
          ''
        );


    if (!texto) {
      return 0;
    }


    let normalizado =
      texto;


    if (
      texto.includes(
        ','
      ) &&
      texto.includes(
        '.'
      )
    ) {

      normalizado =
        texto
          .replace(
            /\./g,
            ''
          )
          .replace(
            ',',
            '.'
          );

    } else if (
      texto.includes(
        ','
      )
    ) {

      normalizado =
        texto.replace(
          ',',
          '.'
        );

    }


    const numero =
      Number(
        normalizado
      );


    return Number.isFinite(
      numero
    )
      ? numero
      : 0;

  }


  function formatarNumeroEditavel(
    valor
  ) {

    if (
      valor === null ||
      valor === undefined ||
      valor === ''
    ) {
      return '';
    }


    return Number(
      valor
    ).toLocaleString(
      'pt-BR',
      {
        minimumFractionDigits:
          2,

        maximumFractionDigits:
          2
      }
    );

  }


  function normalizarBusca(
    valor
  ) {

    return String(
      valor ?? ''
    )
      .normalize(
        'NFD'
      )
      .replace(
        /[\u0300-\u036f]/g,
        ''
      )
      .toLowerCase()
      .trim();

  }


  function escaparHtml(
    valor
  ) {

    return String(
      valor ?? ''
    )
      .replaceAll(
        '&',
        '&amp;'
      )
      .replaceAll(
        '<',
        '&lt;'
      )
      .replaceAll(
        '>',
        '&gt;'
      )
      .replaceAll(
        '"',
        '&quot;'
      )
      .replaceAll(
        "'",
        '&#039;'
      );

  }


  function escaparAtributo(
    valor
  ) {

    return String(
      valor ?? ''
    )
      .replaceAll(
        '\\',
        '\\\\'
      )
      .replaceAll(
        "'",
        "\\'"
      );

  }

</script>
