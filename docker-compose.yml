name: funderr

services:
    web:
        build:
            context: .
            target: web
        image: funderr-web:local
        restart: unless-stopped
        ports:
            - "127.0.0.1:8080:80"
        depends_on:
            app:
                condition: service_started
        healthcheck:
            test:
                ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 10s

    app: &app-runtime
        build:
            context: .
            target: app
        image: funderr-app:local
        restart: unless-stopped
        env_file:
            - .env
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            QUEUE_CONNECTION: redis
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            FILESYSTEM_DISK: local
            LOG_CHANNEL: stderr
        volumes:
            - documents:/var/www/html/storage/app/private
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    scheduler:
        <<: *app-runtime
        command: ["php", "artisan", "schedule:work"]
        user: www-data
        init: true
        stop_signal: SIGTERM
        stop_grace_period: 120s

    horizon:
        <<: *app-runtime
        command: ["php", "artisan", "horizon"]
        user: www-data
        stop_signal: SIGTERM
        stop_grace_period: 120s

    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:?Defina DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME:?Defina DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    redis:
        image: redis:8-alpine
        restart: unless-stopped
        command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory-policy
            - noeviction
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    postgres_data:
    redis_data:
    documents:
